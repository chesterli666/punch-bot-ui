<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人班表設定</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* 深色固定配色：Telegram 內嵌瀏覽器在 Android/iOS 主題變數不一致，
     與其跟著 themeParams 跑掉版型，不如比照公司系統做一套自己的深色。 */
  :root{
    --bg:#0b1014; --card:#111a20; --line:#1f6f3f; --line-soft:#20303a;
    --fg:#e8f2ec; --dim:#7d9a8b; --accent:#22c55e; --accent-dk:#166534;
    --warn:#f59e0b; --title:#f97316;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       -webkit-tap-highlight-color:transparent;padding:12px 12px 12px}
  h1{margin:.2em 0 .1em;font-size:1.5rem;text-align:center;color:var(--title);letter-spacing:.05em}
  .month{text-align:center;font-size:1.15rem;font-weight:700}
  .mnav{display:flex;align-items:center;justify-content:center;gap:14px}
  .mnav .month{min-width:9.5em}
  .marrow{border:0;background:transparent;color:var(--accent);font-size:1.2rem;
          padding:6px 10px;cursor:pointer;font-family:inherit}
  .marrow[disabled]{color:#33413a;cursor:default}
  .mtabs{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  .mtab{border:1px solid var(--line-soft);background:transparent;color:var(--dim);
        border-radius:999px;padding:4px 12px;font-size:.8rem;font-family:inherit;cursor:pointer}
  .mtab.cur{border-color:var(--accent);color:var(--accent)}
  .dot{color:var(--warn);font-size:1.3em;line-height:0;vertical-align:middle}
  .other{margin-top:8px;font-size:.78rem;color:var(--warn);text-align:center}
  .who{text-align:center;color:var(--warn);font-size:.85rem;margin-top:2px}
  .cls{text-align:center;color:var(--dim);font-size:.85rem;margin-top:2px}
  .quota{text-align:center;margin:10px 0;color:var(--accent);font-size:1rem}
  .quota b{font-size:1.35rem;margin:0 4px}
  .quota.zero{color:var(--warn)}
  .grid-wrap{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
  table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
  th{color:var(--dim);font-weight:500;font-size:.8rem;padding-bottom:4px}
  th.sun,th.sat{color:var(--accent)}
  td{padding:0}
  .day{width:100%;aspect-ratio:1/1;border:0;border-radius:8px;background:#1a242b;
       color:#cfe0d6;font-size:1rem;font-family:inherit;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       line-height:1.1;transition:transform .08s}
  .day:active{transform:scale(.9)}
  .day.blank{background:transparent;cursor:default}
  .day.hol{background:#2a2016;color:var(--warn)}          /* 例假/國定假日 */
  .day.on{background:var(--accent);color:#06210f;font-weight:700}   /* 已劃休假 */
  .day.on.hol{background:var(--warn);color:#241a06}
  .day.dirty{box-shadow:inset 0 0 0 2px #fff6}            /* 這次才改動的 */
  .day.past{opacity:.35;cursor:not-allowed}
  /* 同事休假人數：直接標在日格下緣，愈多愈橘——劃休假時要避開的就是這個 */
  .day .co{font-size:.52rem;margin-top:1px;color:#8aa79a}
  .day .co.w1{color:#d9c07a} .day .co.w2{color:#f0a24a} .day .co.w3{color:#f9743b;font-weight:700}
  .day.on .co,.day.on.hol .co{color:#0a2a16}
  .cobox{margin-top:12px;border-top:1px dashed var(--line-soft);padding-top:10px}
  .cohead{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--dim);
          margin-bottom:6px;flex-wrap:wrap}
  .cochips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .cochip{border:1px solid var(--line-soft);background:transparent;color:var(--dim);
          border-radius:999px;padding:3px 9px;font-size:.72rem;font-family:inherit;cursor:pointer}
  .cochip.on{border-color:var(--warn);color:var(--warn)}
  .colist{max-height:190px;overflow-y:auto;font-size:.74rem;line-height:1.7}
  .corow{display:flex;gap:6px;padding:2px 0;border-bottom:1px dashed #16222a}
  .corow:last-child{border-bottom:0}
  .corow .d{flex:0 0 2.4em;color:var(--warn);text-align:right}
  .corow .c{flex:0 0 2.6em;color:var(--dim)}
  .corow .nm{flex:1;color:#cfe0d6;word-break:break-all}
  .corow .nm em{color:var(--accent);font-style:normal}   /* 自己 */
  .conone{color:var(--dim);font-size:.76rem}
  .note{margin-top:12px;text-align:center;font-size:.75rem;color:var(--dim);line-height:1.7}
  .note .h{color:var(--warn)}
  .diff{margin-top:10px;font-size:.82rem;line-height:1.8}
  .diff .add{color:var(--accent)} .diff .rem{color:#f87171}
  .clsbox{margin-top:12px}
  select{width:100%;padding:10px;border-radius:8px;background:#1a242b;color:var(--fg);
         border:1px solid var(--line-soft);font-family:inherit;font-size:.95rem}
  .locked{color:var(--dim);font-size:.8rem;text-align:center;margin-top:6px}
  /* 兩顆按鈕排在內容最後（不用 fixed：會蓋住月曆，實機踩過） */
  .bar{display:flex;gap:8px;margin-top:14px}
  .submit{flex:1;padding:16px 8px;border:0;border-radius:12px;
          background:var(--accent);color:#06210f;font-size:1rem;font-weight:700;
          font-family:inherit;cursor:pointer;box-shadow:0 6px 20px #0008}
  .submit.ghost{flex:0 0 34%;background:#16222a;color:var(--fg);
                border:1px solid var(--line-soft);box-shadow:none}
  .submit[disabled]{background:#2b3a33;color:#6b7f74;box-shadow:none;border-color:transparent}
  .drynote{text-align:center;font-size:.72rem;color:var(--warn);margin-top:8px}
  .err{padding:24px;text-align:center;color:var(--warn);line-height:1.9}
</style>
</head>
<body>
<div id="app"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* 資料走 URL fragment（#z=壓縮／#d=未壓縮）不是 query：fragment 不會送到伺服器，
   班表內容就不會留在任何一層 access log 裡。

   `#z=` 是 zlib 壓縮版（同 coworker/punchtime 那幾頁的作法）。月份一多，未壓縮的
   base64 會撞上 Telegram reply_markup 的網址長度上限（踩過：三個月 1459 字元）。
   `#d=` 保留著相容舊網址——Telegram 沿用還開著的 Mini App 視窗時，網址可能是舊的。 */
function b64bytes(s) {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function readPayload() {
  const z = location.hash.match(/[#&]z=([^&]+)/);
  if (z) {
    if (!window.DecompressionStream) throw new Error('NO_DS');
    const ds = new DecompressionStream('deflate');
    const buf = await new Response(new Blob([b64bytes(z[1])]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  const d = location.hash.match(/[#&]d=([^&]+)/);
  return d ? JSON.parse(new TextDecoder().decode(b64bytes(d[1]))) : null;
}

/* P＝整包（多個月份），S＝目前顯示的那個月的區塊。
   EDIT/CLS 依月份分開存，所以切月份不會弄丟前一個月改到一半的東西。 */
let P = null, S = null, off = null, EDIT = {}, CLS = {};
let COG = null;          // 同事休假要看哪個部門（null＝全部門）

async function init() {
  try { P = await readPayload(); } catch (e) { P = null; }
  if (!P || !(P.months || []).length) {
    document.getElementById('app').innerHTML =
      '<div class="err">缺少班表資料。<br>請回 Telegram 用 /sedit_web 重新開啟。</div>';
    return;
  }
  P.months.forEach(b => {
    EDIT[b.month] = new Set(b.off_days || []);
    CLS[b.month] = b.class_set ? b.class_id : null;
  });
  setMonth(P.cur || P.months[0].month);
}

function setMonth(m) {
  S = P.months.find(b => b.month === m) || P.months[0];
  off = EDIT[S.month];
  render();
}

function monthIndex() { return P.months.findIndex(b => b.month === S.month); }

function shiftMonth(step) {
  const i = monthIndex() + step;
  if (i < 0 || i >= P.months.length) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  setMonth(P.months[i].month);
}

const base = () => new Set(S.off_days || []);

/* 例假日 = 週六日（本地算，不佔網址長度）＋ bot 帶來的國定假日 */
function holName(d) {
  const n = (S.holidays || {})[d];
  if (n) return n;
  const w = new Date(+S.month.slice(0, 4), +S.month.slice(5, 7) - 1, d).getDay();
  return (w === 0 || w === 6) ? '例假日' : '';
}
const isHol = d => !!holName(d);

function toggle(d) {
  if (S.locked_days && S.locked_days.includes(d)) return;
  if (off.has(d)) off.delete(d);
  else {
    if (off.size >= S.has_leave) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      // Telegram WebView 會擋原生 alert()，有 showAlert 時優先用官方彈窗
      const msg = `可劃額度只有 ${S.has_leave} 天，要再劃請先取消其他休假。`;
      if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
      return;
    }
    off.add(d);
  }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  render();
}

/* 某個月的變更；不給月份就算目前這個月 */
function diffLists(m) {
  const blk = m ? P.months.find(x => x.month === m) : S;
  const cur = EDIT[blk.month], b = new Set(blk.off_days || []);
  return {
    add: [...cur].filter(d => !b.has(d)).sort((x, y) => x - y),
    rem: [...b].filter(d => !cur.has(d)).sort((x, y) => x - y),
  };
}

/* 所有月份的變更彙總（送出用，也用來決定按鈕能不能按） */
function allChanges() {
  return P.months.map(blk => {
    const { add, rem } = diffLists(blk.month);
    const cls = (!blk.class_set && CLS[blk.month]) ? +CLS[blk.month] : null;
    return { month: blk.month, add, remove: rem, class_id: cls };
  }).filter(c => c.add.length || c.remove.length || c.class_id);
}

/* ── 同事休假參考（唯讀，只是拿來避開大家都休的日子）────────────────
   資料是 bridge 端用 dept_schedule.is_leave 算好的（到職等 0 小時的人事事件不算休假），
   這裡只負責畫；姓名與部門是索引表，日期指過去。 */
function coDays() {
  const co = P.co;
  if (!co || !co.d[S.month]) return null;
  const out = {};
  for (const [d, idxs] of Object.entries(co.d[S.month])) {
    const keep = COG === null ? idxs : idxs.filter(i => co.n[i][1] === COG);
    if (keep.length) out[d] = keep;
  }
  return out;
}

function coHeat(n, max) {
  if (!n) return '';
  const r = n / (max || 1);
  return r >= .66 ? 'w3' : r >= .33 ? 'w2' : 'w1';
}

/* 熱度的刻度基準：**排除「全公司都休」的日子**（週末／國定假日整批 40 人）。
   不排除的話刻度會被撐到 40，平日 6~14 人的差別全變同一色，這張表就白畫了。
   60% 這條線與 dept_grid 推算公司休日用的是同一個門檻。 */
function coScale(days) {
  if (!days) return 1;
  const total = (P.co.n || []).length || 1;
  const normal = Object.values(days).map(v => v.length).filter(n => n < total * 0.6);
  return Math.max(1, ...(normal.length ? normal : Object.values(days).map(v => v.length)));
}

function coBox(days, max) {
  const co = P.co;
  if (!co) return '';
  if (!days) return `<div class="cobox"><div class="conone">👥 尚無 ${S.month} 的全部門班表，
    無法參考同事休假（回 Telegram 跑 /dept_schedule_sync 抓一次）。</div></div>`;
  const ds = Object.keys(days).map(Number).sort((a, b) => a - b);
  const chips = [['全部門', null], ...co.g.map((g, i) => [g, i])];
  return `<div class="cobox">
    <div class="cohead">👥 同事休假參考（${COG === null ? '全部門' : co.g[COG]}）
      ${ds.length ? `· 平日最多 ${max} 人（顏色刻度，不含全公司都休的日子）` : ''}</div>
    <div class="cochips">${chips.map(([label, g]) =>
      `<button class="cochip${COG === g ? ' on' : ''}" data-g="${g === null ? '' : g}">${label}</button>`
    ).join('')}</div>
    <div class="colist">${ds.length ? ds.map(d => {
      // 名字只列前 6 個，其餘 +N（同逐步版 _se_coworker_text 的截斷作法）。
      // 自己一定排最前面——想知道的第一件事就是「那天我休了沒」。
      const me = (co.n[co.me] || [])[0];
      const sorted = [...days[d]].sort((a, b) =>
        (co.n[b][0] === me) - (co.n[a][0] === me));
      const show = sorted.slice(0, 6).map(i => co.n[i][0] === me
        ? `<em>${co.n[i][0]}</em>` : co.n[i][0]);
      const more = sorted.length - show.length;
      return `<div class="corow"><span class="d">${d}日</span>
        <span class="c">${days[d].length} 人</span>
        <span class="nm">${show.join('、')}${more ? ` +${more}` : ''}</span></div>`;
    }).join('') : '<div class="conone">這個部門本月沒有人休假</div>'}</div>
  </div>`;
}

function render() {
  const y = +S.month.slice(0, 4), mo = +S.month.slice(5, 7);
  const first = new Date(y, mo - 1, 1).getDay();      // 0=日，與下方表頭一致
  const days = S.days_in_month;
  const b = base();
  const coday = coDays();
  const comax = coScale(coday);

  let cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  let rows = '';
  for (let i = 0; i < cells.length; i += 7) {
    rows += '<tr>' + cells.slice(i, i + 7).map(d => {
      if (d === null) return '<td><div class="day blank"></div></td>';
      const cl = ['day'];
      if (isHol(d)) cl.push('hol');
      if (off.has(d)) cl.push('on');
      if (off.has(d) !== b.has(d)) cl.push('dirty');
      if ((S.locked_days || []).includes(d)) cl.push('past');
      const label = off.has(d) ? '✓' : d;
      const tip = holName(d);
      const n = (coday && coday[d] || []).length;
      const badge = n ? `<span class="co ${coHeat(n, comax)}">${n}人</span>` : '';
      return `<td><div class="${cl.join(' ')}" data-d="${d}" title="${tip}">${label}${badge}</div></td>`;
    }).join('') + '</tr>';
  }

  const remaining = S.has_leave - off.size;
  const { add, rem } = diffLists();
  const fmt = a => a.map(d => d + '日').join('、');

  const clsBox = S.class_set
    ? `<div class="locked">班別 ${S.class_name} 🔒 已鎖定，不可變更</div>`
    : `<div class="clsbox"><select id="cls">
         <option value="">— 選擇班別（送出後鎖定不可改）—</option>
         ${(S.classes || []).map(([i, n]) =>
            `<option value="${i}"${CLS[S.month] == i ? ' selected' : ''}>${n}</option>`).join('')}
       </select></div>`;

  // 月份切換：只能切「bot 已經抓過的月份」——這頁不能登入公司系統，切不到沒抓過的月
  const i = monthIndex(), changed = allChanges();
  const dot = m => changed.some(c => c.month === m) ? '<span class="dot">•</span>' : '';
  const nav = P.months.length > 1 ? `
    <div class="mnav">
      <button class="marrow" id="mprev"${i === 0 ? ' disabled' : ''}>◀</button>
      <div class="month">${S.month} 月份${dot(S.month)}</div>
      <button class="marrow" id="mnext"${i === P.months.length - 1 ? ' disabled' : ''}>▶</button>
    </div>
    <div class="mtabs">${P.months.map(bk =>
      `<button class="mtab${bk.month === S.month ? ' cur' : ''}" data-m="${bk.month}">${bk.month.slice(5)}月${dot(bk.month)}</button>`
     ).join('')}</div>`
    : `<div class="month">${S.month} 月份</div>`;

  document.getElementById('app').innerHTML = `
    <h1>個人班表設定</h1>
    ${nav}
    ${P.user ? `<div class="who">${P.user}</div>` : ''}
    <div class="cls">${S.class_name || '（班別未設定）'}</div>
    <div class="quota ${remaining <= 0 ? 'zero' : ''}">🌴 剩餘可用天數 <b>${remaining}</b> 天</div>
    <div class="grid-wrap">
      <table>
        <thead><tr>${['日','一','二','三','四','五','六']
          .map((w, i) => `<th class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${clsBox}
      ${coBox(coday, comax)}
      <div class="diff">
        ${add.length ? `<div class="add">➕ 將新增休假：${fmt(add)}</div>` : ''}
        ${rem.length ? `<div class="rem">➖ 將取消休假：${fmt(rem)}</div>` : ''}
      </div>
      ${changed.length > 1 ? `<div class="other">其他月份也有變更：${
        changed.filter(c => c.month !== S.month).map(c => c.month).join('、')}（會一起送出）</div>` : ''}
      <div class="note">
        <span class="h">⚠️ 送出提醒</span><br>
        送出後由機器人登入公司系統逐日寫入，<br>
        實際結果以系統回覆的訊息為準。
      </div>
    </div>
    <div class="bar">
      <button class="submit ghost" id="prev"${changed.length ? '' : ' disabled'}>👀 預覽</button>
      <button class="submit" id="go"${changed.length ? '' : ' disabled'}>
        ✅ 確認送出${changed.length > 1 ? `（${changed.length} 個月）` : ''}</button>
    </div>
    ${P.dry ? '<div class="drynote">⚠️ 目前是測試模式（config.ini dry=1），兩顆都不會真的寫入</div>' : ''}`;

  document.querySelectorAll('.day[data-d]').forEach(el =>
    el.addEventListener('click', () => toggle(+el.dataset.d)));
  const prev = document.getElementById('mprev'), next = document.getElementById('mnext');
  if (prev) prev.addEventListener('click', () => shiftMonth(-1));
  if (next) next.addEventListener('click', () => shiftMonth(1));
  document.querySelectorAll('.mtab').forEach(el =>
    el.addEventListener('click', () => setMonth(el.dataset.m)));
  document.querySelectorAll('.cochip').forEach(el =>
    el.addEventListener('click', () => { COG = el.dataset.g === '' ? null : +el.dataset.g; render(); }));
  const sel = document.getElementById('cls');
  if (sel) sel.addEventListener('change', () => { CLS[S.month] = sel.value || null; render(); });
  document.getElementById('prev').addEventListener('click', () => submit('dry'));
  document.getElementById('go').addEventListener('click', () => submit('send'));
}

function submit(mode) {
  const payload = { v: 2, nonce: P.nonce || '', mode, changes: allChanges() };
  if (!tg) { alert('（瀏覽器預覽模式）將送出：\n' + JSON.stringify(payload, null, 2)); return; }
  tg.sendData(JSON.stringify(payload));   // 送出後 Telegram 會自動關閉本頁
}

init();
</script>
</body>
</html>
