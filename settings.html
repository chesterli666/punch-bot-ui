<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設定中心</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b1014; --card:#111a20; --line-soft:#22303a;
    --fg:#e8f2ec; --dim:#7d9a8b; --accent:#22c55e; --warn:#f59e0b;
    --bad:#ef4444; --title:#f97316; --on:#60a5fa; --off:#fb923c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       -webkit-tap-highlight-color:transparent;padding:10px 0 90px}
  h1{margin:.1em 10px .1em;font-size:1.2rem;text-align:center;color:var(--title)}
  .sub{text-align:center;color:var(--dim);font-size:.76rem;margin-bottom:10px;line-height:1.7}

  .card{background:var(--card);border:1px solid var(--line-soft);border-left-width:4px;
        border-radius:10px;padding:11px 12px;margin:0 10px 10px}
  .ct{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .ct .nm{font-size:.92rem;font-weight:700}
  .ct .tag{font-size:.68rem;color:var(--dim);margin-left:auto;white-space:nowrap}
  .hint{font-size:.7rem;color:var(--dim);line-height:1.7;margin-bottom:8px}

  /* 時刻用時/分下拉，不打字（同專案其他頁的作法：選時刻一律用選單） */
  .times{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .grp{display:flex;align-items:center;gap:3px}
  select{padding:8px 6px;border-radius:8px;background:#16222a;color:var(--fg);
         border:1px solid var(--line-soft);font-family:inherit;font-size:.95rem}
  .colon{color:var(--dim);font-weight:700}
  .to{color:var(--dim);font-size:.8rem;padding:0 2px}
  .chg{font-size:.72rem;color:var(--warn);margin-top:7px;min-height:1em}
  .chg.same{color:var(--dim)}

  .foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 22%);
        padding:14px 10px 12px}
  button.go{width:100%;padding:13px;border-radius:10px;border:0;font-family:inherit;
            font-size:.98rem;font-weight:700;color:#05130b;background:var(--accent);cursor:pointer}
  button.go:disabled{background:#1c2b33;color:var(--dim);cursor:default}
  .note{padding:2px 12px 8px;color:var(--dim);font-size:.7rem;line-height:1.8;text-align:center}
  .err{padding:28px;text-align:center;color:var(--warn);line-height:2}
  /* 各帳號區塊：跟上面的全域設定用一條分隔線與說明分開，免得看不出誰蓋誰 */
  .sect{margin:16px 10px 8px;padding-top:12px;border-top:1px solid var(--line-soft)}
  .sect .st{font-size:.9rem;font-weight:700;color:var(--title)}
  .sect .sd{font-size:.7rem;color:var(--dim);line-height:1.8;margin-top:3px}
  .card.off{opacity:.62}
  .badge{font-size:.66rem;padding:1px 6px;border-radius:99px;border:1px solid var(--line-soft);color:var(--dim)}
  .sub2{font-size:.72rem;color:var(--dim);margin:6px 0 3px}
</style>
</head>
<body>
<div id="app"><div class="sub">載入中…</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function b64bytes(s) {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function readPayload() {
  const z = location.hash.match(/[#&]z=([^&]+)/);
  if (z) {
    if (!window.DecompressionStream) throw new Error('NO_DS');
    const ds = new DecompressionStream('deflate');
    const buf = await new Response(new Blob([b64bytes(z[1])]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  const d = location.hash.match(/[#&]d=([^&]+)/);
  return d ? JSON.parse(new TextDecoder().decode(b64bytes(d[1]))) : null;
}

let P = null;
// 目前畫面上的值。初值＝config 現值，送出時後端只收「跟現值不一樣」的那幾組
let cur = { on: ['', ''], off: ['', ''], sync: '' };
// 各帳號現值：{key: {on:[..], off:[..]}}，初值同樣＝accounts.json 現值
let curA = {};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }

/* 時/分兩個下拉。分鐘給 5 分一格＋保留目前值（config 裡可能是 08:33 這種非整五分的值，
   下拉沒有它就會在開啟頁面的當下被悄悄改掉，那是最難查的那種 bug） */
function timeSelect(id, hhmm) {
  const [h, m] = String(hhmm || '00:00').split(':').map(Number);
  let hs = '';
  for (let i = 0; i < 24; i++) hs += '<option value="' + i + '"' + (i === h ? ' selected' : '') + '>' + pad(i) + '</option>';
  const mins = [];
  for (let i = 0; i < 60; i += 5) mins.push(i);
  if (!mins.includes(m)) mins.push(m);
  mins.sort((a, b) => a - b);
  const ms = mins.map(i => '<option value="' + i + '"' + (i === m ? ' selected' : '') + '>' + pad(i) + '</option>').join('');
  return '<span class="grp"><select id="' + id + 'h">' + hs + '</select>'
       + '<span class="colon">:</span><select id="' + id + 'm">' + ms + '</select></span>';
}
function readSelect(id) {
  return pad(+document.getElementById(id + 'h').value) + ':' + pad(+document.getElementById(id + 'm').value);
}

/* 有沒有任何一組跟原值不同——沒有就把送出鈕關掉（後端也會擋，這裡只是不要白跑一趟） */
function dirty() {
  if (cur.on[0] !== P.on[0] || cur.on[1] !== P.on[1]
      || cur.off[0] !== P.off[0] || cur.off[1] !== P.off[1]
      || cur.sync !== P.sync) return true;
  return (P.accts || []).some(a =>
    curA[a.k].on[0] !== a.on[0] || curA[a.k].on[1] !== a.on[1]
    || curA[a.k].off[0] !== a.off[0] || curA[a.k].off[1] !== a.off[1]);
}

/* 全域那組跟哪些帳號其實是同一個值——全域一改就會把它們一起蓋掉，
   所以有帳號同時被手動改到時要當場講，不能等送出後才發現被覆蓋。 */
function globalChanged() {
  return cur.on[0] !== P.on[0] || cur.on[1] !== P.on[1]
      || cur.off[0] !== P.off[0] || cur.off[1] !== P.off[1];
}

function refresh() {
  cur.on = [readSelect('on1'), readSelect('on2')];
  cur.off = [readSelect('off1'), readSelect('off2')];
  cur.sync = readSelect('sy');

  // 每組各自標「原本 X → 現在 Y」；順序顛倒直接標紅並擋送出（同後端的規則）
  let bad = false;
  for (const [key, node] of [['on', 'chgOn'], ['off', 'chgOff']]) {
    const el = document.getElementById(node);
    const same = cur[key][0] === P[key][0] && cur[key][1] === P[key][1];
    if (cur[key][0] >= cur[key][1]) {
      el.className = 'chg'; el.style.color = 'var(--bad)';
      el.textContent = '⚠️ 結束時間要晚於開始時間';
      bad = true;
      continue;
    }
    el.style.color = '';
    el.className = 'chg' + (same ? ' same' : '');
    el.textContent = same ? '未變更（' + P[key][0] + '~' + P[key][1] + '）'
                          : '將改為 ' + cur[key][0] + '~' + cur[key][1] + '（原 ' + P[key][0] + '~' + P[key][1] + '）';
  }
  const sy = document.getElementById('chgSy');
  const samesy = cur.sync === P.sync;
  sy.className = 'chg' + (samesy ? ' same' : '');
  sy.textContent = samesy ? '未變更（' + P.sync + '）' : '將改為 ' + cur.sync + '（原 ' + P.sync + '）';

  for (const a of (P.accts || [])) {
    curA[a.k] = { on: [readSelect('a_' + a.k + '_on1'), readSelect('a_' + a.k + '_on2')],
                  off: [readSelect('a_' + a.k + '_off1'), readSelect('a_' + a.k + '_off2')] };
    for (const k2 of ['on', 'off']) {
      const el = document.getElementById('chg_' + a.k + '_' + k2);
      const v = curA[a.k][k2], o = a[k2];
      if (v[0] >= v[1]) {
        el.className = 'chg'; el.style.color = 'var(--bad)';
        el.textContent = '⚠️ 結束時間要晚於開始時間';
        bad = true;
        continue;
      }
      el.style.color = '';
      const same = v[0] === o[0] && v[1] === o[1];
      el.className = 'chg' + (same ? ' same' : '');
      el.textContent = same ? '未變更（' + o[0] + '~' + o[1] + '）'
                            : '將改為 ' + v[0] + '~' + v[1] + '（原 ' + o[0] + '~' + o[1] + '）';
      // 上面的全域也被改了 → 這格會先被全域蓋過、再被自己蓋回來，講明順序
      if (!same && globalChanged()) el.textContent += '　（會蓋過上面的全域值）';
    }
  }

  const go = document.getElementById('go');
  go.disabled = bad || !dirty();
  go.textContent = bad ? '⚠️ 時間順序不對' : (dirty() ? '✅ 送出設定變更' : '沒有變更');
}

function submit() {
  if (!tg) { alert('請由 Telegram 開啟'); return; }
  tg.sendData(JSON.stringify({
    kind: 'settings', v: 1, nonce: P.nonce, mode: 'send',
    on: cur.on, off: cur.off, sync: cur.sync, accts: curA,
  }));
  tg.close();
}

function nextText(k) {
  const t = (P.next || {})[k];
  return t ? '下次 ' + esc(t) : '';
}

/* 各帳號的區間。**這才是真正決定打卡的值**——sched.register 拿 accounts.json 的
   work_start 去建 AutoPunch-In-<帳號>，punch.py 也走 --acct；上面的全域那組是預設，
   一改就會套到所有啟用中的帳號。原本要改這裡得回 Telegram 的「帳號管理→⏰ 改區段」
   打兩輪「HH:MM HH:MM」，那是全專案最後一個要打字輸入時刻的地方。 */
function acctSection() {
  const list = P.accts || [];
  if (!list.length) return '';
  let h = '<div class="sect"><div class="st">👥 各帳號打卡區間</div>'
        + '<div class="sd">這是實際在跑的值。改上面的全域區間會<b>一起蓋掉所有啟用中的帳號</b>；'
        + '要讓某個帳號跟別人不一樣，就只改這裡。</div></div>';
  for (const a of list) {
    const nx = ((P.next || {}).acct || {})[a.k] || [];
    h += '<div class="card' + (a.en ? '' : ' off') + '" style="border-left-color:'
       + (a.en ? 'var(--accent)' : 'var(--line-soft)') + '">'
       + '<div class="ct"><span class="nm">👤 ' + esc(a.label) + '</span>'
       + (a.en ? '' : '<span class="badge">已停用</span>')
       + '<span class="tag">' + (nx[0] ? '上班下次 ' + esc(nx[0]) : '') + '</span></div>'
       + (a.en ? '' : '<div class="hint">停用中：值照樣存得起來，但不會建排程（啟用時才會建）。</div>')
       + '<div class="sub2">🟦 上班區間' + (nx[0] ? '　·　下次 ' + esc(nx[0]) : '') + '</div>'
       + '<div class="times">' + timeSelect('a_' + a.k + '_on1', a.on[0])
       + '<span class="to">～</span>' + timeSelect('a_' + a.k + '_on2', a.on[1]) + '</div>'
       + '<div class="chg same" id="chg_' + a.k + '_on"></div>'
       + '<div class="sub2">🟧 下班區間' + (nx[1] ? '　·　下次 ' + esc(nx[1]) : '') + '</div>'
       + '<div class="times">' + timeSelect('a_' + a.k + '_off1', a.off[0])
       + '<span class="to">～</span>' + timeSelect('a_' + a.k + '_off2', a.off[1]) + '</div>'
       + '<div class="chg same" id="chg_' + a.k + '_off"></div>'
       + '</div>';
  }
  return h;
}

function render() {
  document.getElementById('app').innerHTML =
    '<h1>⚙️ 設定中心</h1>'
    + '<div class="sub">打卡區間、每日同步、各帳號區間，一頁看完也一頁改完<br>'
    + '（取代「打卡區間／改上班區間／改下班區間／自動同步時間／設定自動同步」五顆＋帳號管理的「改區段」）</div>'

    + '<div class="card" style="border-left-color:var(--on)">'
    + '<div class="ct"><span class="nm">🟦 上班打卡區間</span><span class="tag">' + nextText('on') + '</span></div>'
    + '<div class="hint">自動打卡只會發生在這段區間內（區間內隨機時刻）。排程觸發時間＝開始時間。</div>'
    + '<div class="times">' + timeSelect('on1', P.on[0]) + '<span class="to">～</span>' + timeSelect('on2', P.on[1]) + '</div>'
    + '<div class="chg same" id="chgOn"></div></div>'

    + '<div class="card" style="border-left-color:var(--off)">'
    + '<div class="ct"><span class="nm">🟧 下班打卡區間</span><span class="tag">' + nextText('off') + '</span></div>'
    + '<div class="hint">同上，非此區間一律不會打卡。</div>'
    + '<div class="times">' + timeSelect('off1', P.off[0]) + '<span class="to">～</span>' + timeSelect('off2', P.off[1]) + '</div>'
    + '<div class="chg same" id="chgOff"></div></div>'

    + '<div class="card" style="border-left-color:var(--accent)">'
    + '<div class="ct"><span class="nm">🔄 每日班表同步</span><span class="tag">' + nextText('sync') + '</span></div>'
    + '<div class="hint">每天這個時間自動抓一次個人班表（自動打卡的判斷依據）＋全部門班表（同事查詢）。</div>'
    + '<div class="times">' + timeSelect('sy', P.sync) + '</div>'
    + '<div class="chg same" id="chgSy"></div></div>'

    + acctSection()

    + '<div class="note">送出後 Telegram 會先給一張預覽卡，按「確定套用」才真的寫入。<br>'
    + '寫的是本機 config.ini 與 Windows 排程，不會碰公司系統。</div>'
    + '<div class="foot"><button class="go" id="go" disabled>沒有變更</button></div>';

  document.querySelectorAll('select').forEach(el => el.addEventListener('change', refresh));
  document.getElementById('go').addEventListener('click', submit);
  refresh();
}

async function init() {
  let err = null;
  try { P = await readPayload(); } catch (e) { err = e.message; }
  if (!P) {
    document.getElementById('app').innerHTML = err === 'NO_DS'
      ? '<div class="err">Telegram 內建瀏覽器太舊，無法解壓縮資料。<br>請更新後再試，或用 /times、/set_on、/set_off。</div>'
      : '<div class="err">缺少資料。<br>請回 Telegram 用 /settings_web 重新開啟。</div>';
    return;
  }
  render();
}
init();
</script>
</body>
</html>
