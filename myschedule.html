<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的班表</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b1014; --card:#111a20; --line-soft:#22303a;
    --fg:#e8f2ec; --dim:#7d9a8b; --accent:#22c55e; --warn:#f59e0b; --title:#f97316;
    --off:#38bdf8; --bad:#ef4444;
    --halfbg:linear-gradient(90deg,#38bdf8 0 50%,#1a242b 50% 100%);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       -webkit-tap-highlight-color:transparent;padding:12px}
  h1{margin:.2em 0 .1em;font-size:1.4rem;text-align:center;color:var(--title)}
  .sub{text-align:center;color:var(--dim);font-size:.76rem;margin-bottom:12px}
  .sec{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;
       padding:12px;margin-bottom:10px}
  .lb{font-size:.8rem;color:var(--dim);margin-bottom:8px}
  .lb b{color:var(--accent)}

  .mnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
  .mnav .mt{font-weight:700;min-width:8em;text-align:center}
  .marrow{border:0;background:transparent;color:var(--accent);font-size:1.1rem;
          padding:4px 10px;cursor:pointer;font-family:inherit}
  .marrow[disabled]{color:#33413a;cursor:default}

  table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
  th{color:var(--dim);font-weight:500;font-size:.74rem;padding-bottom:2px}
  th.we{color:var(--accent)}
  .day{width:100%;aspect-ratio:1/1.06;border:0;border-radius:8px;background:#1a242b;color:#cfe0d6;
       font-size:.86rem;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
       align-items:center;justify-content:center;line-height:1.15;overflow:hidden;
       text-shadow:0 1px 2px #000a}
  .day.blank{background:transparent;cursor:default}
  .day.hol{background:#2a2016;color:var(--warn)}
  .day.o{background:#1b2b34;color:#7fc4dd}                 /* 整天休假 */
  .day.h{background:var(--halfbg);color:#cfe0d6}           /* 半天假＝只填一半（同同事班表那頁） */
  .day.today{box-shadow:inset 0 0 0 2px var(--title)}
  .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .day small{font-size:.5rem;opacity:.9;display:block}
  .day small.t{font-size:.48rem;color:#9fd6b6}
  .day small.bad{color:var(--bad)}
  .day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
  .day .dot.wait{background:#5b6d63}
  .day .dot.odd{background:var(--warn)}

  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.68rem;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;
            vertical-align:-1px;margin-right:4px}

  .kv{display:flex;gap:8px;font-size:.85rem;padding:5px 0;border-bottom:1px dashed #1c2830}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--dim);flex:0 0 5.2em}
  .kv .v{flex:1}
  .kv .v.bad{color:var(--bad)}
  .kv .v.off{color:var(--off)}

  .list{font-size:.84rem;line-height:1.9}
  .list .d{color:var(--off)}
  .list .n{color:var(--dim);font-size:.78rem}
  .run{padding:6px 0;border-bottom:1px dashed #1c2830}
  .run:last-child{border-bottom:0}
  .run b{color:var(--warn)}
  .err{padding:28px;text-align:center;color:var(--warn);line-height:2}
</style>
</head>
<body>
<div id="app"><div class="sub">載入中…</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* 縮小視窗＝直接關掉這個 Mini App。
   踩過（使用者實機回報）：Telegram 同一個 bot 只留一個 Mini App 視窗，往下滑「縮小」
   不等於關閉；下次點別的功能鈕，它會沿用這個舊視窗、根本不載新網址（?v= 破快取沒用），
   於是「開部門總表卻跳出打卡記錄」。唯讀頁沒有任何未存資料，關掉再點一下就好，
   所以乾脆縮小就自我了斷，讓下一次一定是全新載入。寫入型的表單頁不套這段（會弄丟填到一半的內容）。
   延遲 1 秒是為了避開「叫出鍵盤／截圖」這種瞬間的 hidden。 */
let _hideTimer = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    _hideTimer = setTimeout(() => { if (document.hidden && tg && tg.close) tg.close(); }, 1000);
  } else if (_hideTimer) {
    clearTimeout(_hideTimer); _hideTimer = null;
  }
});


function b64bytes(s) {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function readPayload() {
  const z = location.hash.match(/[#&]z=([^&]+)/);
  if (z) {
    if (!window.DecompressionStream) throw new Error('NO_DS');
    const ds = new DecompressionStream('deflate');
    const buf = await new Response(new Blob([b64bytes(z[1])]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  const d = location.hash.match(/[#&]d=([^&]+)/);
  return d ? JSON.parse(new TextDecoder().decode(b64bytes(d[1]))) : null;
}

const WD = ['日', '一', '二', '三', '四', '五', '六'];
let P = null, mi = 0, sel = null;

async function init() {
  let err = null;
  try { P = await readPayload(); } catch (e) { err = e.message; }
  if (!P) {
    document.getElementById('app').innerHTML = err === 'NO_DS'
      ? '<div class="err">Telegram 內建瀏覽器太舊，無法解壓縮資料。<br>請更新後再試，或用 /schedule_month 的文字版。</div>'
      : '<div class="err">缺少資料。<br>請回 Telegram 用 /my_web 重新開啟。</div>';
    return;
  }
  mi = Math.max(0, P.months.findIndex(b => b.m === P.cur));
  sel = P.today.slice(0, 7) === P.months[mi].m ? +P.today.slice(8, 10) : null;
  render();
}

const cur = () => P.months[mi];
const cellOf = (d) => (cur().cells[d] || {});
const times = (arr) => (arr || []).map(x => x[0]).join('、');
const isLate = (arr) => (arr || []).some(x => x[1]);

/* 今天打了上班卡、還沒打下班卡，資料上是「未完整(x)」，但那其實是「上班中」，
   不該跟真的異常長一樣——只在今天這一格做這個區分。 */
function isWorking(ds, c) {
  return ds === P.today && c.k === 'x' && times(c.o).replace('—', '') === '';
}

function dayTag(d, ds, c) {
  if (c.k === 'o' || c.k === 'h') {
    return `<small>${(c.l || '休假').slice(0, 5)}</small>`;
  }
  if (c.i && c.i.length) {
    const cls = isLate(c.i) || isLate(c.o) ? 'bad' : '';
    const out = times(c.o) || '';
    return `<small class="t ${cls}">${times(c.i)}</small>` +
           (out && out !== '—' ? `<small class="t ${cls}">${out}</small>` : '');
  }
  if (c.k === 'n') return '<span class="dot wait"></span>';
  if (c.k === 'e') return '<small>📌</small>';
  return '';
}

function calendarHtml() {
  const b = cur(), y = +b.m.slice(0, 4), mo = +b.m.slice(5, 7);
  const first = new Date(y, mo - 1, 1).getDay();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= b.days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  let rows = '';
  for (let i = 0; i < cells.length; i += 7) {
    rows += '<tr>' + cells.slice(i, i + 7).map(d => {
      if (d === null) return '<td><div class="day blank"></div></td>';
      const ds = `${b.m}-${String(d).padStart(2, '0')}`;
      const w = new Date(y, mo - 1, d).getDay();
      const c = cellOf(d);
      const k = ['day'];
      if (b.hol[d] || w === 0 || w === 6) k.push('hol');
      if (c.k === 'o') k.push('o');
      if (c.k === 'h') k.push('h');
      if (ds === P.today) k.push('today');
      if (d === sel) k.push('sel');
      return `<td><div class="${k.join(' ')}" data-d="${d}">${d}${dayTag(d, ds, c)}</div></td>`;
    }).join('') + '</tr>';
  }
  return `
    <div class="mnav">
      <button class="marrow" id="mp"${mi === 0 ? ' disabled' : ''}>◀</button>
      <span class="mt">${b.m}</span>
      <button class="marrow" id="mn"${mi === P.months.length - 1 ? ' disabled' : ''}>▶</button>
    </div>
    <table>
      <thead><tr>${WD.map((w, i) =>
        `<th class="${i === 0 || i === 6 ? 'we' : ''}">${w}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="legend">
      <span><i style="background:#1b2b34"></i>整天休假</span>
      <span><i style="background:var(--halfbg)"></i>半天假</span>
      <span><i style="background:#2a2016"></i>例假/國定假日</span>
      <span><i style="background:var(--bad)"></i>紅字＝遲到或早退</span>
      <span>📌 人事異動（不是休假）</span>
    </div>`;
}

function detailHtml() {
  const b = cur();
  if (!sel) return '<div class="sec"><div class="lb">點月曆上的日期看當天細節</div></div>';
  const ds = `${b.m}-${String(sel).padStart(2, '0')}`;
  const c = cellOf(sel);
  const w = WD[new Date(+b.m.slice(0, 4), +b.m.slice(5, 7) - 1, sel).getDay()];
  const rows = [];

  if (c.k === 'o' || c.k === 'h') {
    rows.push(['狀態', `<span class="v off">${c.k === 'o' ? '整天休假' : '半天假'}　${c.l || ''}</span>`]);
  } else if (isWorking(ds, c)) {
    rows.push(['狀態', '上班中（還沒打下班卡）']);
  } else if (c.k === 'w') { rows.push(['狀態', '出勤完整']); }
  else if (c.k === 'x') { rows.push(['狀態', '<span class="v bad">打卡不完整</span>']); }
  else if (c.k === 'n') { rows.push(['狀態', '有排班，尚未打卡']); }
  else if (c.k === 'e') { rows.push(['狀態', '人事異動（不是休假）']); }
  else { rows.push(['狀態', '無排班無紀錄']); }

  if (c.i && c.i.length) {
    rows.push(['上班', `<span class="v ${isLate(c.i) ? 'bad' : ''}">${times(c.i)}${isLate(c.i) ? '（遲到）' : ''}</span>`]);
    const out = times(c.o);
    rows.push(['下班', `<span class="v ${isLate(c.o) ? 'bad' : ''}">${out || '—'}${isLate(c.o) ? '（早退）' : ''}</span>`]);
  }
  if (c.c) rows.push(['當天班別', c.c]);
  if (c.e) rows.push(['事件', c.e]);
  if (b.hol[sel]) rows.push(['節日', b.hol[sel]]);
  if (c.v) rows.push(['班表原文', c.v]);

  return `<div class="sec">
    <div class="lb">${ds}（週${w}）</div>
    ${rows.map(([k, v]) => `<div class="kv"><span class="k">${k}</span>
      ${v.startsWith('<span') ? v : `<span class="v">${v}</span>`}</div>`).join('')}
  </div>`;
}

function offListHtml() {
  const b = cur();
  const days = Object.keys(b.cells).map(Number).sort((a, z) => a - z)
    .filter(d => ['o', 'h'].includes((b.cells[d] || {}).k));
  const full = days.filter(d => b.cells[d].k === 'o').length;
  const half = days.length - full;
  return `<div class="sec">
    <div class="lb">${b.m} 休假 <b>${full} 天</b>${half ? `＋半天假 ${half} 天` : ''}</div>
    <div class="list">${days.length
      ? days.map(d => `<span class="d">${d}日</span> <span class="n">${b.cells[d].l || ''}</span>`).join('　')
      : '<span class="n">這個月沒有休假紀錄</span>'}</div>
  </div>`;
}

function runsHtml() {
  if (!P.runs.length) return '';
  return `<div class="sec">
    <div class="lb">🎉 連假預告（連續放假 ≥ 3 天）</div>
    ${P.runs.map(([a, z, n, mark]) => `<div class="run">
      <b>${a.slice(5)} ~ ${z.slice(5)}</b>　連休 ${n} 天
      <span class="n">${mark || ''}</span></div>`).join('')}
  </div>`;
}

function render() {
  const b = cur();
  document.getElementById('app').innerHTML = `
    <h1>我的班表</h1>
    <div class="sub">${P.user || ''}${b.cls ? `　·　${b.cls}` : ''}${b.pf ? `　·　更新於 ${b.pf}` : ''}</div>
    <div class="sec">${calendarHtml()}</div>
    ${detailHtml()}
    ${offListHtml()}
    ${runsHtml()}`;

  document.querySelectorAll('.day[data-d]').forEach(el =>
    el.addEventListener('click', () => { sel = +el.dataset.d; render(); }));
  document.getElementById('mp').addEventListener('click', () => {
    if (mi > 0) { mi--; sel = null; render(); } });
  document.getElementById('mn').addEventListener('click', () => {
    if (mi < P.months.length - 1) { mi++; sel = null; render(); } });
}

init();
</script>
</body>
</html>
