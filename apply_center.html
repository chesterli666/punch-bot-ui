<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>申請中心</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b1014; --card:#111a20; --line-soft:#22303a;
    --fg:#e8f2ec; --dim:#7d9a8b; --accent:#22c55e; --warn:#f59e0b; --title:#f97316;
    --info:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       -webkit-tap-highlight-color:transparent;padding:12px}
  h1{margin:.2em 0 .1em;font-size:1.4rem;text-align:center;color:var(--title)}
  .sub{text-align:center;color:var(--dim);font-size:.76rem;margin-bottom:12px}
  .sec{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;
       padding:12px;margin-bottom:10px}
  .lb{font-size:.8rem;color:var(--dim);margin-bottom:8px}
  .lb b{color:var(--accent)}

  /* 三種申請用頁籤切換（比照 changes.html）。切頁籤只換表單，日期與事由刻意保留， */
  /* 因為常見情境是「同一天的事」先看提早延後、再改成打卡修改。 */
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;padding:10px 4px;border:1px solid var(--line-soft);background:#16222a;
       color:var(--dim);border-radius:10px;font-size:.82rem;font-family:inherit;
       cursor:pointer;text-align:center;line-height:1.3}
  .tab.on{border-color:var(--title);color:var(--fg);font-weight:700;background:#1d2a22}
  .tab[disabled]{opacity:.35;cursor:not-allowed}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:9px 12px;border:1px solid var(--line-soft);background:#16222a;color:var(--fg);
        border-radius:999px;font-size:.84rem;font-family:inherit;cursor:pointer}
  .chip.on{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
  .chip.cls{font-size:.78rem;padding:8px 10px}

  textarea{width:100%;padding:10px;border-radius:8px;background:#16222a;color:var(--fg);
    border:1px solid var(--line-soft);font-family:inherit;font-size:.9rem;
    resize:vertical;min-height:64px}
  select{background:#16222a;color:var(--fg);border:1px solid var(--line-soft);
    border-radius:8px;padding:10px 12px;font-family:inherit;font-size:1.05rem}
  .timerow{display:flex;align-items:center;gap:8px}
  .timerow .colon{font-size:1.1rem;color:var(--dim)}
  .quick{margin-left:auto;display:flex;gap:6px}
  .quick .chip{padding:7px 10px;font-size:.76rem}

  .mnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
  .mnav .mt{font-weight:700;min-width:8em;text-align:center}
  .marrow{border:0;background:transparent;color:var(--accent);font-size:1.1rem;
          padding:4px 10px;cursor:pointer;font-family:inherit}
  .marrow[disabled]{color:#33413a;cursor:default}
  table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
  th{color:var(--dim);font-weight:500;font-size:.74rem;padding-bottom:2px}
  th.we{color:var(--accent)}
  .day{width:100%;aspect-ratio:1/1;border:0;border-radius:8px;background:#1a242b;color:#cfe0d6;
       font-size:.9rem;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
       align-items:center;justify-content:center;line-height:1.1}
  .day.blank{background:transparent;cursor:default}
  .day.hol{background:#2a2016;color:var(--warn)}
  .day.off{background:#1b2b34;color:#7fc4dd}            /* 自己的休假日 */
  .day.today{box-shadow:inset 0 0 0 1px var(--info)}
  .day.on{background:var(--accent);color:#06210f;font-weight:700}
  .day small{font-size:.5rem;opacity:.85}
  .monthpick{text-align:center;color:var(--info);font-size:.8rem;margin-top:6px}

  .warn{color:var(--warn);font-size:.78rem;margin-top:6px;line-height:1.6}
  .bar{display:flex;gap:8px;margin-top:14px}
  .submit{flex:1;padding:15px 8px;border:0;border-radius:12px;
          background:var(--accent);color:#06210f;font-size:1rem;font-weight:700;
          font-family:inherit;cursor:pointer;box-shadow:0 6px 20px #0008}
  .submit.ghost{flex:0 0 34%;background:#16222a;color:var(--fg);
                border:1px solid var(--line-soft);box-shadow:none}
  .submit[disabled]{background:#2b3a33;color:#6b7f74;box-shadow:none;border-color:transparent}
  .drynote{text-align:center;font-size:.72rem;color:var(--warn);margin-top:8px}
  .err{padding:28px;text-align:center;color:var(--warn);line-height:2}
</style>
</head>
<body>
<div id="app"><div class="sub">載入中…</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function b64bytes(s) {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function readPayload() {
  const z = location.hash.match(/[#&]z=([^&]+)/);
  if (z) {
    if (!window.DecompressionStream) throw new Error('NO_DS');
    const ds = new DecompressionStream('deflate');
    const buf = await new Response(new Blob([b64bytes(z[1])]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  const d = location.hash.match(/[#&]d=([^&]+)/);
  return d ? JSON.parse(new TextDecoder().decode(b64bytes(d[1]))) : null;
}

const WD = ['日', '一', '二', '三', '四', '五', '六'];
const TABS = [['shift', '⏱ 提早/延後'], ['pedit', '🛠 打卡修改'], ['class', '🧩 班別修改']];

let P = null, sub = 'shift', mi = 1;          // mi 預設 1＝本月（月份是上月/本月/下月）
let date = '', reason = '';
let skind = '', pkind = '', ci = null, hh = '09', mm = '00';

async function init() {
  let err = null;
  try { P = await readPayload(); } catch (e) { err = e.message; }
  if (!P) {
    document.getElementById('app').innerHTML = err === 'NO_DS'
      ? '<div class="err">Telegram 內建瀏覽器太舊，無法解壓縮資料。<br>請更新後再試，或用 /shift、/punch_edit、/class_edit 的逐步版。</div>'
      : '<div class="err">缺少資料。<br>請回 Telegram 用 /center_web 重新開啟。</div>';
    return;
  }
  if (P.today) { date = P.today; mi = P.months.findIndex(b => b.m === P.today.slice(0, 7)); }
  if (mi < 0) mi = 0;
  render();
}

const cur = () => P.months[mi];
const ready = () => {
  if (!date) return false;
  if (sub === 'shift') return !!skind;
  if (sub === 'pedit') return !!pkind;
  return ci !== null;
};

function calendarHtml() {
  const b = cur(), y = +b.m.slice(0, 4), mo = +b.m.slice(5, 7);
  const first = new Date(y, mo - 1, 1).getDay();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= b.days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  let rows = '';
  for (let i = 0; i < cells.length; i += 7) {
    rows += '<tr>' + cells.slice(i, i + 7).map(d => {
      if (d === null) return '<td><div class="day blank"></div></td>';
      const ds = `${b.m}-${String(d).padStart(2, '0')}`;
      const w = new Date(y, mo - 1, d).getDay();
      const holName = b.hol[d];
      const isOff = b.off.includes(d);
      const c = ['day'];
      if (holName || w === 0 || w === 6) c.push('hol');
      if (isOff) c.push('off');
      if (ds === P.today) c.push('today');
      if (ds === date) c.push('on');
      const tag = isOff ? '<small>休</small>'
        : holName ? `<small>${holName.slice(0, 3)}</small>` : '';
      return `<td><div class="${c.join(' ')}" data-ds="${ds}">${d}${tag}</div></td>`;
    }).join('') + '</tr>';
  }
  return `
    <div class="mnav">
      <button class="marrow" id="mp"${mi === 0 ? ' disabled' : ''}>◀</button>
      <span class="mt">${b.m}</span>
      <button class="marrow" id="mn"${mi === P.months.length - 1 ? ' disabled' : ''}>▶</button>
    </div>
    <table>
      <thead><tr>${WD.map((w, i) =>
        `<th class="${i === 0 || i === 6 ? 'we' : ''}">${w}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${sub === 'class'
      ? `<div class="monthpick">班別修改是<b>整月套用</b>：點該月任一天即可（目前 ${date ? date.slice(0, 7) : '未選'}）</div>`
      : ''}`;
}

function timeHtml() {
  const opt = (n, v) => `<option value="${n}"${n === v ? ' selected' : ''}>${n}</option>`;
  const hs = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
  const ms = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
  return `
    <div class="lb">要修改成的<b>打卡時刻</b>（24 小時制）</div>
    <div class="timerow">
      <select id="hh">${hs.map(n => opt(n, hh)).join('')}</select>
      <span class="colon">:</span>
      <select id="mm">${ms.map(n => opt(n, mm)).join('')}</select>
      <span class="quick">
        <button class="chip" data-t="08:30">08:30</button>
        <button class="chip" data-t="09:00">09:00</button>
        <button class="chip" data-t="18:00">18:00</button>
      </span>
    </div>`;
}

function formHtml() {
  if (sub === 'shift') {
    return `<div class="sec">
      <div class="lb">類型 ${skind ? `<b>${P.shift.find(x => x[0] === skind)[1]}</b>` : '（必選）'}</div>
      <div class="chips">${P.shift.map(([k, v]) =>
        `<button class="chip${k === skind ? ' on' : ''}" data-k="${k}" data-f="skind">${v}</button>`).join('')}</div>
    </div>`;
  }
  if (sub === 'pedit') {
    return `<div class="sec">
      <div class="lb">要修改的是 ${pkind ? `<b>${P.pedit.find(x => x[0] === pkind)[1]}</b>` : '（必選）'}</div>
      <div class="chips">${P.pedit.map(([k, v]) =>
        `<button class="chip${k === pkind ? ' on' : ''}" data-k="${k}" data-f="pkind">${v}</button>`).join('')}</div>
    </div>
    <div class="sec">${timeHtml()}</div>`;
  }
  if (!P.classes.length) {
    return `<div class="sec"><div class="warn">⚠️ 本機還沒有班別清單，
      請回 Telegram 跑 /leave_sync 抓一次再回來。</div></div>`;
  }
  return `<div class="sec">
    <div class="lb">新班別 ${ci !== null ? `<b>${P.classes[ci]}</b>` : '（必選）'}
      ${P.fetched ? `　·　清單更新於 ${P.fetched}` : ''}</div>
    <div class="chips">${P.classes.map((c, i) =>
      `<button class="chip cls${i === ci ? ' on' : ''}" data-ci="${i}">${c}</button>`).join('')}</div>
  </div>`;
}

function render() {
  const label = { shift: '申請日期', pedit: '打卡日期', class: '套用月份' }[sub];
  document.getElementById('app').innerHTML = `
    <h1>申請中心</h1>
    <div class="sub">${P.user || ''}　·　三種申請一頁填完</div>

    <div class="tabs">${TABS.map(([k, v]) =>
      `<button class="tab${k === sub ? ' on' : ''}" data-t="${k}">${v}</button>`).join('')}</div>

    ${formHtml()}

    <div class="sec">
      <div class="lb">${label} ${date
        ? `<b>${sub === 'class' ? date.slice(0, 7) : date}</b>`   /* 班別是整月，顯示到日反而讓人以為只改那天 */
        : '（必選）'}</div>
      ${calendarHtml()}
    </div>

    <div class="sec">
      <div class="lb">事由</div>
      <textarea id="rs" placeholder="選填（例如：忘記打卡）">${reason}</textarea>
    </div>

    <div class="bar">
      <button class="submit ghost" id="prev"${ready() ? '' : ' disabled'}>👀 預覽</button>
      <button class="submit" id="go"${ready() ? '' : ' disabled'}>✅ 確認送出</button>
    </div>
    ${P.dry ? '<div class="drynote">⚠️ 目前是測試模式（config.ini dry=1），兩顆都不會真的送出</div>' : ''}`;

  document.querySelectorAll('.tab').forEach(el =>
    el.addEventListener('click', () => { sub = el.dataset.t; render(); }));
  document.querySelectorAll('.chip[data-f]').forEach(el =>
    el.addEventListener('click', () => {
      if (el.dataset.f === 'skind') skind = el.dataset.k; else pkind = el.dataset.k;
      render();
    }));
  document.querySelectorAll('.chip[data-ci]').forEach(el =>
    el.addEventListener('click', () => { ci = +el.dataset.ci; render(); }));
  document.querySelectorAll('.chip[data-t]').forEach(el =>
    el.addEventListener('click', () => {
      [hh, mm] = el.dataset.t.split(':'); render();
    }));
  document.querySelectorAll('.day[data-ds]').forEach(el =>
    el.addEventListener('click', () => { date = el.dataset.ds; render(); }));
  document.getElementById('mp').addEventListener('click', () => { if (mi > 0) { mi--; render(); } });
  document.getElementById('mn').addEventListener('click', () => {
    if (mi < P.months.length - 1) { mi++; render(); } });
  const h = document.getElementById('hh'), m = document.getElementById('mm');
  if (h) h.addEventListener('change', e => { hh = e.target.value; });   // 不重繪，免得下拉跳掉
  if (m) m.addEventListener('change', e => { mm = e.target.value; });
  const rs = document.getElementById('rs');
  rs.addEventListener('input', e => { reason = e.target.value; });      // 不重繪，免得游標跳掉
  document.getElementById('prev').addEventListener('click', () => submit('dry'));
  document.getElementById('go').addEventListener('click', () => submit('send'));
}

function submit(mode) {
  const payload = { kind: 'center', nonce: P.nonce || '', mode, sub, date, reason };
  if (sub === 'shift') payload.skind = skind;
  if (sub === 'pedit') { payload.pkind = pkind; payload.time = `${hh}:${mm}`; }
  if (sub === 'class') payload.ci = ci;
  if (!tg || !tg.sendData) { alert(JSON.stringify(payload, null, 2)); return; }
  tg.sendData(JSON.stringify(payload));
}

init();
</script>
</body>
</html>
